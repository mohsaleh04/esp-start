[package]
edition = "2024"
name = "esp-start"
rust-version = "1.98.1"
version = "0.8.16"

[[bin]]
name = "esp-start"
path = "./src/bin/main.rs"
test = false
bench = false

[lib]
test = false
bench = false

[dependencies]
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32"] }

esp-hal = { version = "~1.2.1", features = ["esp32", "unstable"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32", "wifi", "ble", "coex", "esp-alloc", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["esp32", "esp-radio", "esp-alloc", "embassy"] }
esp-alloc = { version = "0.11.0", features = ["esp32"] }

embedded-hal = "1.0.0"
embedded-hal-bus = "0.3"
embedded-sdmmc = "0.10"

embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "tcp", "udp"] }
embassy-executor = "0.10.0"
embassy-time = "0.5.1"
embassy-futures = "0.1.2"
heapless = "0.9.3"

bt-hci = "=0.9.0"
trouble-host = { version = "=0.7.0", features = ["scan"] }

critical-section = "1.2.0"
static_cell = "2.1.1"


# For fine-tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.dev.package.esp-radio]
opt-level = 3

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug = 2     # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
